<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b63"><title>大阪・宇治每日行程與景點介紹｜旅途中更新版</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f6f8fb;color:#213244;line-height:1.75}a{color:#1769aa}.wrap{width:min(1080px,calc(100% - 24px));margin:auto}.hero{padding:48px 0 36px;background:linear-gradient(135deg,#e8f2ff,#fff7e8)}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.08;margin:.25em 0;color:#173b63}h2,h3{color:#173b63}.tag{display:inline-block;background:#fff;border:1px solid #dce6ef;border-radius:999px;padding:5px 11px;margin:4px 4px 0 0}.intro{max-width:800px}.status{margin-top:14px;padding:10px 12px;background:#eaf7ef;border:1px solid #cfe7d8;border-radius:12px}.days{display:grid;gap:22px;padding:30px 0}.day{background:#fff;border:1px solid #dce6ef;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #2030400b}.head{padding:20px;background:#eef6ff;border-bottom:1px solid #dce6ef}.head b{font-size:.9rem;color:#58708a}.head h2{margin:3px 0}.body{padding:20px}.route{font-weight:800;margin-bottom:14px}.timeline{border-left:3px solid #bdd5ea;padding-left:18px}.stop{position:relative;margin:0 0 22px;padding-bottom:18px;border-bottom:1px dashed #dce6ef}.stop:last-child{border-bottom:0}.stop:before{content:"";position:absolute;left:-25px;top:8px;width:11px;height:11px;border-radius:50%;background:#2c79b9;border:3px solid #fff;box-shadow:0 0 0 1px #9dbbd4}.time{font-size:.82rem;font-weight:800;color:#6a7684}.stop h3{margin:3px 0 6px;font-size:1.12rem}.brief{margin:0 0 8px;color:#47596b}.focus{margin:8px 0;padding:11px 13px;border-radius:13px;background:#f4f8fc}.focus strong{color:#173b63}.map{display:inline-block;margin-top:6px;text-decoration:none;font-weight:800;font-size:.83rem;background:#e9f3ff;padding:5px 10px;border-radius:999px}.tips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.tip{background:#f5f8fb;border-radius:12px;padding:10px 12px;font-size:.9rem}.tip.warn{background:#fff4e8}.footer{text-align:center;padding:30px;color:#687684}@media(max-width:700px){.tips{grid-template-columns:1fr}.body{padding:16px}.head{padding:17px}}</style></head><body><header class="hero"><div class="wrap"><div>2026.08.09–08.14｜大阪・宇治6天5夜</div><h1>每日行程與景點介紹｜旅途中更新版</h1><p class="intro">這頁專門給同行者看：每天怎麼走、每個景點看什麼、哪裡值得買、哪裡可以依阿嬤體力彈性刪減。</p><span class="tag">長者友善</span><span class="tag">大眾運輸</span><span class="tag">景點導覽</span><span class="tag">購物提醒</span><div class="status"><b>✅ 2026/8/9 晚間更新</b>｜Day 2 已取消道頓堀水上觀光船，改為 Aqua-Liner＋通天閣／新世界；Dive & Walk 為選配。</div></div></header><main class="wrap"><section class="days" id="days"></section></main><footer class="footer">大阪・宇治自由行｜每日行程與景點介紹｜2026/8/9更新</footer><script>const days=[{d:'DAY1｜8/9（日）',t:'抵達大阪：難波八阪神社、關東煮、道頓堀',r:'神戶機場T2→Port Liner→三宮→阪神→大阪難波→Metro→大國町',s:[['08:15–11:45','桃園T1→神戶機場T2','抵達後先完成入境、領行李，再由T2前往T1旁的神戶空港站。','重點是順利轉乘，不在機場安排額外停留。','Kobe Airport Terminal 2'],['約13:00–16:00','前往大國町飯店','Port Liner到三宮，步行轉阪神到大阪難波，再轉大阪Metro一站到大國町。','這段是全程最重要的搬行李路線，先到飯店放行李休息。','Hotel Sobial Namba Daikokucho'],['16:25–16:55','難波八阪神社','最醒目的是巨大獅子殿，是大阪市區非常有辨識度的拍照點。','只有班機準時、大家仍有精神才去；延誤就取消。','難波八阪神社'],['17:20–18:30','たこ梅本店','大阪老字號關東煮店，適合第一天用一頓溫熱晚餐開場。','推薦體驗關東煮與老店氣氛，不追求吃很久。','たこ梅本店'],['18:30–20:00','道頓堀散步','大阪最具代表性的繁華街之一。','看固力果跑跑人、戎橋與河岸霓虹。Day2不再安排道頓堀遊船。','道頓堀 グリコサイン'],['20:10後','Super玉出惠美須店','補水、零食與生活用品。','適合買礦泉水、飲料、優格、水果與隔天備用點心。','スーパー玉出 恵美須店']],tip:['第一天不排太滿','神社是第一刪除點','阿嬤只走核心河岸','飯店大國町站6號出口約1分鐘']},{d:'DAY2｜8/10（一）',t:'大阪周遊卡日：木津市場、大阪城、Aqua-Liner、通天閣',r:'大國町→木津市場→大阪城→Aqua-Liner→新世界／通天閣→大國町',s:[['07:00–07:40','飯店早餐','前兩晚住宿含早餐。','早餐後確認大阪周遊卡QR、手機、水、帽子；今天不再繞去道頓堀換票。','Hotel Sobial Namba Daikokucho'],['08:00–09:15','木津市場','大阪在地市場，可看海鮮、蔬果、乾貨與熟食。','市場要早去；少量多吃、保留後續體力。','大阪木津卸売市場'],['約09:30–10:15','前往大阪城／先確認Aqua-Liner班次','抵達大阪城區後，優先確認當日水上巴士指定班次與換票方式。','Aqua-Liner是今天最需要鎖定時間的行程，建議以14:00或15:00前後班次為目標，依現場實際可換班次調整。','大阪水上バス 大阪城港'],['10:30–11:30','午餐／休息','大阪城或森之宮附近用餐。','先坐下補充體力，避免正中午一路曝曬。','森ノ宮駅'],['11:40–13:30','大阪城天守閣＋豐臣石垣館','大阪代表性地標，可看豐臣秀吉與大阪城歷史。','天守閣外觀、頂層視野與豐臣石垣是重點；園區很大，不追求全部走完。','大阪城天守閣'],['14:00或15:00前後','Aqua-Liner 水上巴士','約55分鐘，從水面欣賞大阪城、大川與中之島城市水岸。','以現場換到的指定班次為準；這一段正式取代道頓堀水上觀光船。','大阪水上バス 大阪城港'],['船後～16:30','休息／前往新世界','下船後保留彈性，不再硬塞大阪城御座船。','天氣熱或長輩累就直接移動，這段是全日緩衝時間。','新世界'],['約17:00起','通天閣＋新世界','晚上改玩新世界。一般展望台適合全家一起看大阪街景。','通天閣一般展望台可放晚一點；先處理有較早截止時間的活動。','通天閣'],['17:00–19:00間','TOWER SLIDER／Dive & Walk（選配）','想玩刺激活動的人可分流體驗；不參加者可在新世界休息、逛街。','Tower Slider建議20:00前完成受理；Dive & Walk若要玩，務必提早處理，不拖到19:15最後受理。Dive & Walk不是全家必玩，體力或條件不合就刪。','通天閣 Dive & Walk'],['19:00後','新世界晚餐＋夜景','在新世界吃晚餐、看亮燈後的通天閣與街區。','晚上不再回今天已逛過的道頓堀；吃完依大家體力直接回大國町。','新世界'],['20:30後','彈性回飯店','新世界離大國町近，晚餐後不用再跨區趕景點。','累了就回飯店洗衣休息；還有精神再現場小逛，不預先塞行程。','Hotel Sobial Namba Daikokucho']],tip:['木津市場要早去，上午優先','Aqua-Liner班次是今日時間鎖','取消道頓堀水上觀光船與大阪城御座船','Dive & Walk選配；全家共同體驗優先']},{d:'DAY3｜8/11（二）',t:'池田與心齋橋：杯麵、池田城跡、Funko、PABLO',r:'退房寄行李→池田→心齋橋→取行李→Airbnb',s:[['上午','飯店早餐／退房寄行李','先處理大件行李，輕裝前往池田。','護照、藥品、行動電源與貴重物品隨身。','Hotel Sobial Namba Daikokucho'],['09:30–11:45','日清杯麵博物館大阪池田','以安藤百福與即食麵發展史為主題，也可自己設計杯麵。','必玩自製杯麵；看泡麵隧道與發明故事。','カップヌードルミュージアム 大阪池田'],['11:50–12:50','池田午餐','池田站附近自行挑選。','以能坐下、出餐穩定為優先，不追熱門排隊名店。','池田駅'],['13:00–14:00','池田城跡公園','小巧的日式城跡公園，有庭園與城樓。','若天氣太熱或阿嬤累，直接取消。','池田城跡公園'],['15:15–16:15','Bobbing World','Funko Pop與潮流收藏品重點店。','買到盒裝收藏品後立刻裝套夾／保護盒；8/11營業狀況行前再次確認。','Bobbing World Osaka'],['16:15–17:40','心齋橋短逛＋PABLO','甜點休息與短逛。','心齋橋不用逛滿，依體力縮短。','PABLO 心斎橋本店'],['18:00–19:00','領行李＋入住Airbnb','回大國町領行李後入住。','Airbnb在大國町站1號出口附近，以房東最新入住資訊為準。','パルステージ難波南']],tip:['池田要搭阪急，不是全程Metro','Bobbing World行前再次確認營業','Funko保護盒帶在身上','Airbnb大國町站1號出口約1分鐘']},{d:'DAY4｜8/12（三）',t:'宇治一日：平等院、宇治上神社、宇治茶與甜點',r:'大國町→淀屋橋→中書島→京阪宇治',s:[['07:50–09:40','前往宇治','Metro到淀屋橋，轉京阪本線至中書島，再轉京阪宇治線。','京阪特急一般車廂不用加價，不要誤坐Premium Car。','京阪宇治駅'],['09:50–11:20','平等院庭園＋鳳翔館','宇治核心景點，十圓硬幣上的鳳凰堂就在這裡。','現行程記成人700日圓；以庭園、鳳凰堂外觀與鳳翔館為主。','平等院'],['11:30–13:00','宇治表參道午餐','餐廳現場挑選。','保留用餐與坐下休息時間，不趕行程。','宇治橋通り商店街'],['13:00–13:40','辻利／宇治茶伴手禮','買抹茶、茶葉、茶點等伴手禮。','先買常溫、好攜帶的品項。','辻利 宇治'],['13:50–14:30','宇治上神社','世界文化遺產之一。','依阿嬤體力決定是否完整走到；累就刪。','宇治上神社'],['14:40–15:40','伊藤久右衛門甜點','宇治抹茶甜點與下午休息。','這一站的目的就是坐下、吃甜點、降溫。','伊藤久右衛門 宇治'],['17:30後','LIFE 大國町店','回大阪後買隔日早餐與食材。','不要在宇治背太多生鮮回大阪。','ライフ 大国町店']],tip:['京阪特急一般車廂不用特急券','不要進Premium Car','宇治慢走，不塞京都／奈良','晚上洗衣']},{d:'DAY5｜8/13（四）',t:'黑門市場＋門真購物：Costco、LaLaport、Outlet',r:'黑門市場→心齋橋→接駁巴士→門真商場群',s:[['08:30–10:00','黑門市場','大阪知名市場，適合早餐、小吃與採買。','10點前後開始最有逛市場的感覺；少量多吃。','黒門市場'],['10:10–10:30','前往心齋橋乘車處','移動到門真接駁巴士乘車處。','預留找站牌與候車時間。','心斎橋駅'],['依班次','心齋橋→LaLaport門真','每人單程500日圓、現金、不預約。','可能滿座或塞車，4人來回共準備4,000日圓。','三井ショッピングパーク ららぽーと門真'],['抵達後','Costco 門真','門真購物日先逛Costco。','帶Costco會員卡、折疊購物袋；大件商品先想好行李重量與攜帶方式。','コストコホールセール 門真倉庫店'],['下午','LaLaport＋三井Outlet','商場與Outlet相鄰。','午餐、甜點、購物就地解決，不另外跑餐廳。','三井アウトレットパーク 大阪門真'],['傍晚','接駁車回心齋橋','依班次返回大阪市區。','滿座或錯過就改搭鐵路，不死等。','心斎橋駅'],['晚上','回Airbnb整理戰利品','最後一晚完成打包。','行李秤重、液體分類、Funko四角加固。','パルステージ難波南']],tip:['4人來回接駁準備4,000日圓現金','大型購物優先刷卡','今天不再塞其他大型景點','晚上完成回程打包']},{d:'DAY6｜8/14（五）',t:'大阪→神戶機場→桃園',r:'大國町→大阪難波→阪神神戶三宮→Port Liner→神戶機場T2',s:[['約08:30','Airbnb退房','完成最後整理後離開。','護照、藥品、手機、充電器、冰箱與插座最後檢查。','パルステージ難波南'],['約09:00','大阪難波→神戶三宮','搭阪神電車前往神戶。','行李多，轉乘不要趕。','阪神 神戸三宮駅'],['約10:00','三宮→神戶機場','轉Port Liner到神戶空港。','ICOCA／Suica留足回程餘額。','神戸空港'],['10:30前','抵達神戶機場','辦理托運與安檢。','有餘裕再補買伴手禮，沒有就直接去報到。','Kobe Airport Terminal 2'],['12:45–14:45','神戶T2→桃園T1','返台。','每人託運1件23kg；手提1件7kg。行動電源只能隨身。','Taiwan Taoyuan International Airport']],tip:['最後一天不排景點','預留轉乘與機場緩衝','Funko盒裝四角加固','行動電源隨身攜帶']}];const root=document.querySelector('#days');days.forEach(x=>{const e=document.createElement('article');e.className='day';e.innerHTML=`<div class="head"><b>${x.d}</b><h2>${x.t}</h2></div><div class="body"><div class="route">🚆 ${x.r}</div><div class="timeline">${x.s.map(v=>`<div class="stop"><div class="time">${v[0]}</div><h3>${v[1]}</h3><p class="brief">${v[2]}</p><div class="focus"><strong>這裡要注意／值得看：</strong>${v[3]}</div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v[4])}">Google地圖</a></div>`).join('')}</div><div class="tips">${x.tip.map((v,i)=>`<div class="tip ${i==1?'warn':''}">💡 ${v}</div>`).join('')}</div></div>`;root.appendChild(e)});</script></body></html>
