<body>
<header class="hero"><div class="wrap"><div>2026.08.09–08.14｜大阪・宇治6天5夜</div><h1>每日行程與景點介紹</h1><p class="intro">不只告訴你每天怎麼走，也補上每個景點的特色、值得看的地方、適合買什麼，以及可以如何依照阿嬤體力彈性調整。</p><span class="tag">長者友善</span><span class="tag">大眾運輸</span><span class="tag">景點導覽</span><span class="tag">購物提醒</span></div></header>
<main class="wrap"><section class="days" id="days"></section></main>
<footer class="footer">大阪・宇治自由行｜獨立每日行程與景點介紹網站</footer>
<script>
const days=[
{d:'DAY1｜8/9',t:'抵達大阪：神社、關東煮、道頓堀',r:'神戶機場T2→Port Liner→三宮→阪神→大阪難波→Metro→大國町',s:[
['08:15–11:45','桃園T1→神戶機場T2','抵達關西地區的第一站。神戶機場規模較精簡，入境與領行李後即可銜接Port Liner前往三宮。','重點：先確認所有人的護照、行李與交通卡都在，再開始轉乘。','Kobe Airport Terminal 2'],
['約13:00–16:00','前往大國町飯店','從三宮轉搭阪神電車到大阪難波，再轉大阪Metro至大國町。這段是全程最重要的搬行李路線。','看點：沿途不用安排景點，重點是順利抵達、辦理入住、稍作休息。','Hotel Sobial Namba Daikokucho'],
['16:25–16:55','難波八阪神社','神社最醒目的地標是巨大獅子頭造型的獅子殿，張口的外觀很有震撼感，也是大阪市區相當特別的拍照點。','值得看：獅子殿正面、側面與神社小而安靜的境內。若班機延誤，這站可優先取消。','難波八阪神社'],
['17:20–18:30','たこ梅本店','大阪老字號關東煮店，適合在第一天用一頓溫熱、節奏較慢的晚餐正式開始旅程。','推薦體驗：關東煮、章魚類料理與日式老店氣氛。長者可提早入店，避免久候。','たこ梅本店'],
['18:30–20:00','道頓堀散步','大阪最具代表性的繁華街之一，霓虹招牌、河岸與巨大立體招牌都集中在此。','值得看：固力果跑跑人、戎橋、道頓堀川沿岸。第一晚以看夜景為主，遊船留到Day2。','道頓堀 グリコサイン'],
['20:10後','Super玉出惠美須店','大阪辨識度很高的平價超市，招牌鮮豔，適合補飲料、水果、零食、早餐與日用品。','適合買：礦泉水、優格、水果、簡單熟食與隔天備用點心。','スーパー玉出 恵美須店']],tip:['第一天不排太滿','神社是首要刪除點','阿嬤只走核心河岸','行動電源不能託運']},
{d:'DAY2｜8/10',t:'大阪周遊卡日：市場、大阪城、兩段遊船',r:'大國町→木津市場→道頓堀換票→森之宮→大阪城→心齋橋',s:[
['07:00–07:40','飯店早餐','先在飯店吃早餐，可減少上午找餐廳的時間，也讓大家有體力逛市場與大阪城。','提醒：早餐後再確認周遊卡QR、手機電量、水與帽子。','Hotel Sobial Namba Daikokucho'],
['08:00–09:00','木津市場','大阪市區的重要傳統市場，規模不如觀光市場那麼喧鬧，能看到海鮮、蔬果、乾貨與在地飲食。','值得看：魚貨攤、乾貨、熟食與市場日常。建議少量品嘗，不要在第一站吃太飽。','大阪木津卸売市場'],
['09:20–09:40','先換晚間遊船票','先把晚上的道頓堀遊船班次換好，可避免熱門時段額滿。','重點：確認集合地點、班次與提前報到時間，並把票券截圖留在手機。','とんぼりリバークルーズ チケット売り場'],
['10:30–11:30','鰻魚處美味美UMAMI','以鰻魚料理為主的午餐，安排在大阪城前，可先補充體力再進入範圍較大的城區。','推薦：鰻魚飯與套餐。長者可選份量較輕的餐點。','鰻魚處 美味美 UMAMI 森之宮'],
['11:40–13:10','大阪城天守閣＋豐臣石垣館','大阪代表性地標。天守閣內可了解豐臣秀吉與大阪城歷史，登高後可眺望大阪市區；石垣館則能看到被保存於地下的豐臣時代石垣。','值得看：天守閣外觀、頂層景觀、歷史展示與豐臣石垣。城區很大，務必安排坐下休息。','大阪城天守閣'],
['13:20–14:00','大阪城御座船','從護城河水面欣賞大阪城石垣與天守閣，是比步行更輕鬆的觀景方式。','看點：巨大石垣、護城河視角與大阪城倒影。需現場換指定班次。','大阪城御座船 乗り場'],
['18:00–19:00','北極星心齋橋本店','大阪蛋包飯名店之一，傳統日式建築與庭院氛圍也是特色。','推薦：經典蛋包飯。這一站適合當作下午休息後的輕鬆晚餐。','北極星 心斎橋本店'],
['19:30或20:00','道頓堀水上觀光船','從河面看兩岸霓虹與招牌，比步行更能完整感受道頓堀夜景。','看點：固力果招牌、橋梁、沿岸燈光與熱鬧街景。請提前15分鐘抵達。','とんぼりリバークルーズ 乗り場']],tip:['今天主要用大阪周遊卡','上午先換晚間船票','大阪城安排坐下休息','晚上回住宿可洗衣']},
{d:'DAY3｜8/11',t:'池田與心齋橋：杯麵、Funko、入住Airbnb',r:'退房寄行李→池田→心齋橋→取行李→Airbnb',s:[
['早餐後','退房並寄放行李','先把大件行李留在飯店，輕裝前往池田，會比拖行李轉乘舒服很多。','提醒：貴重物品、護照、藥品與行動電源隨身攜帶。','Hotel Sobial Namba Daikokucho'],
['09:30–11:45','日清杯麵博物館大阪池田','以安藤百福與即食麵發展史為主題，展覽互動性高，也能自己設計杯麵包裝並選擇配料。','必玩：自製杯麵。值得看：泡麵隧道、發明故事與復古產品。','カップヌードルミュージアム 大阪池田'],
['11:50–12:50','池田午餐','博物館附近有不少簡單餐廳，適合找能坐下、出餐穩定的店家。','策略：不追熱門排隊名店，以阿嬤能休息、大家吃得舒服為主。','池田市観光案内所'],
['13:00–14:00','池田城跡公園','小巧的日式城跡公園，有庭園、池塘與重建城樓，可俯瞰池田市區。','值得看：日式庭園與城樓景觀。若天氣炎熱或阿嬤疲累，可直接取消。','池田城跡公園'],
['15:15–16:15','Bobbing World','以Funko Pop與潮流收藏品為主的店，是這趟旅程中最明確的收藏購物站。','選購重點：先檢查盒角、透明窗是否刮傷，再確認是否有保護盒或壓盒套夾。','Bobbing World Osaka'],
['16:15–17:40','心齋橋＋PABLO','心齋橋是大阪重要購物區，藥妝、服飾與甜點店集中；PABLO則以起司塔聞名。','建議：只逛核心路段，買起司甜點後就前往取行李，不要逛到過度疲勞。','PABLO 心斎橋本店'],
['18:00後','取行李並入住Airbnb','完成住宿轉換後，先熟悉門鎖、垃圾規則、洗衣機與最近車站。','提醒：以房東最新定位與入住說明為準，並把住宿地址截圖分享給同行者。','パルステージ難波南']],tip:['Cup Noodles Museum這天有開','Funko建議手提不託運','池田城跡是彈性景點','晚上可選HARUKAS 300']},
{d:'DAY4｜8/12',t:'宇治一日：平等院、抹茶、神社',r:'大阪→宇治→平等院→表參道→宇治上神社→大阪',s:[
['早上','前往宇治','從大阪前往宇治後，步行路線會集中在宇治川與平等院周邊。','看點：一到宇治就能感受到茶鄉與古都氣氛，節奏比大阪市區安靜。','Uji Station'],
['上午','平等院庭園＋鳳翔館','平等院以鳳凰堂最具代表性，也是日圓硬幣與紙鈔圖案常見的文化意象之一。鳳翔館展示寺院文物與建築相關內容。','必看：鳳凰堂倒映池面的經典角度、庭園與館內鳳凰文物。鳳凰堂內部需另購票。','平等院'],
['中午','平等院表參道午餐','表參道聚集抹茶蕎麥麵、茶飯、甜點與伴手禮店，是宇治最方便的用餐區。','建議：優先找有冷氣與座位的店，保留午後體力。','Byodoin Omotesando'],
['午後','辻利買伴手禮','宇治代表性茶品牌之一，可一次看抹茶粉、煎茶、焙茶與常溫甜點。','適合買：茶包、抹茶點心、焙茶點心與易攜帶禮盒。','辻利 宇治本店'],
['彈性','宇治上神社','宇治上神社規模不大，氣氛幽靜，與平等院隔河相望，適合喜歡古建築與神社氛圍的人。','值得看：本殿、拜殿與安靜林蔭。若阿嬤累，這站可取消。','宇治上神社'],
['下午','伊藤久右衛門甜點','宇治知名茶品牌，適合坐下吃抹茶聖代、甜點或飲品，作為午後休息站。','推薦：抹茶聖代、焙茶甜點或季節限定品。','伊藤久右衛門 宇治本店'],
['晚上','LIFE大國町採買','大型生活超市，品項比便利商店完整，適合補水果、牛奶、熟食與隔日早餐。','適合買：便當、壽司、沙拉、飲料與家庭包零食。','ライフ大国町店']],tip:['宇治以平等院為核心','神社可視體力取消','抹茶甜點不要排太密','晚上回住宿可洗衣']},
{d:'DAY5｜8/13',t:'市場與門真購物：Costco、LaLaport、Outlet',r:'黑門市場→心齋橋→付費接駁巴士→門真商場群',s:[
['上午','黑門市場','大阪知名觀光市場，海鮮、水果、和牛、熟食與零食選擇多。','策略：每樣少量分食，先看一圈再買，避免太早買需要冷藏的商品。','黒門市場'],
['上午後段','心齋橋短逛','補逛前幾天沒買到的藥妝、服飾或伴手禮，並預留時間前往接駁車站。','提醒：這天以門真購物為主，心齋橋不要停留過久。','Shinsaibashi Station'],
['中午前後','搭付費接駁巴士','由心齋橋前往LaLaport門真，省去多次電車轉乘，對長者與購物日很方便。','注意：每人單程500日圓、只收現金；4人來回需準備4,000日圓。','三井ショッピングパーク ららぽーと門真'],
['下午','Costco門真','大型量販店，適合採買食品、家用品與日本限定商品，但包裝多偏大。','購物原則：先確認行李空間與重量，再買常溫、輕量、好攜帶商品。記得帶Costco會員卡。','Costco Wholesale Kadoma'],
['下午至晚間','LaLaport＋三井Outlet','LaLaport偏綜合購物與餐飲，Outlet則以品牌折扣商品為主，兩區集中在同一建築群。','適合逛：服飾、鞋包、家居、動漫與餐飲。可依體力分組，約定集合時間。','三井アウトレットパーク 大阪門真']],tip:['4人來回接駁共4,000日圓現金','Costco會員卡要帶','大型購物優先刷卡','回程行李每件控制21～22公斤']},
{d:'DAY6｜8/14',t:'返程：大阪→神戶機場→桃園',r:'Airbnb→大阪難波→阪神→三宮→Port Liner→神戶機場T2',s:[
['早上','退房前最後檢查','最後確認住宿內沒有遺漏充電器、藥品、冰箱食品與個人物品。','建議：一人負責證件、一人負責房間巡查，離開前拍下房況。','パルステージ難波南'],
['建議提早','前往神戶機場','需經大阪難波、三宮與Port Liner轉乘，帶行李時速度會比平常慢。','原則：寧可提早到機場吃飯休息，也不要壓縮轉乘時間。','Kobe Airport Terminal 2'],
['12:45–14:45','神戶T2→桃園T1','辦理報到、託運與安檢後返台。','行李：每人託運1件、每件23公斤；手提1件7公斤。行動電源與Funko盡量手提。','Taiwan Taoyuan International Airport Terminal 1']],tip:['至少提前2小時到機場','液體與大型購物放託運','行動電源放手提','Funko用保護盒並盡量手提']}
];
const root=document.querySelector('#days');
days.forEach(x=>{const e=document.createElement('article');e.className='day';e.innerHTML=`<div class="head"><b>${x.d}</b><h2>${x.t}</h2></div><div class="body"><div class="route">🚆 ${x.r}</div><div class="timeline">${x.s.map(v=>`<div class="stop"><div class="time">${v[0]}</div><h3>${v[1]}</h3><p class="brief">${v[2]}</p><div class="focus"><strong>這裡要注意／值得看：</strong>${v[3]}</div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v[4])}">Google地圖</a></div>`).join('')}</div><div class="tips">${x.tip.map((v,i)=>`<div class="tip ${i==1?'warn':''}">💡 ${v}</div>`).join('')}</div></div>`;root.appendChild(e)});
</script>

</html>
